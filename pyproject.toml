[project]
name = "triad-dr-mcp"
version = "0.9.0"
description = "Decision Registers MCP server (ADR / IDR / MDR) backed by DynamoDB"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "python-ulid>=3.0.0",
    "structlog>=24.4.0",
]

[project.scripts]
triad-dr-mcp = "triad_dr.server:main"
triad-dr = "triad_dr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "moto[dynamodb]>=5.0.0",
    # Ceiling pinned to the cloud-assembly schema the installed CDK CLI (2.1106.1) can read.
    # Newer aws-cdk-lib emits schema 54 and the CLI rejects it. To unpin: npm i -g aws-cdk@latest
    "aws-cdk-lib>=2.160.0,<2.234.0",
    "constructs>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triad_dr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
